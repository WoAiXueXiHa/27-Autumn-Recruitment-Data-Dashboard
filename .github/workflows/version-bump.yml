name: Bump version after merge

on:
  # A merged PR from a fork receives a read-only token under pull_request.
  # This event runs the trusted workflow from main and only checks out main.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Increment public version
        run: python scripts/bump_version.py
      - name: Verify bumped version
        run: python tests_smoke.py
      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md 使用说明.md
          git commit -m "chore: bump version to V$(tr -d '\r\n' < VERSION)"
          git push origin HEAD:main
